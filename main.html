<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <form>
		<label for="name">Name:</label>
		<input id="name" type="text" placeholder="Name" />
		<br><br>
		
		<label for="phone">Phone Number:</label>
		<input id="phone" type="text" placeholder="Phone Number"/>
		<br><br>

		<label for="address">Address:</label>
		<input id="address" type="text" placeholder="Address"/>
		<br><br>

		<label for="checkbox">Have you ever lived with a Dog before?</label>
		<input id="checkbox" value="Have you ever lived with a Dog before?" type="checkbox"/>
		<br><br>

		<label for="multiselect">Please select your preferred breeds</label>
		<select id="multiselect" multiple>
			<option>Labrador</option>
			<option>German Shepherd</option>
			<option>Bulldog</option>
		</select>
		<br><br>
		
		<input id="submit" type="submit"/>
	</form>
	<script type="text/javascript" src="./script.js">
</script>

</body>

</html>
